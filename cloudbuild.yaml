steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/cafe-leather-eu/sync-database:develop-$SHORT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/cafe-leather-eu/sync-database:develop-$SHORT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'sync-pg-service',
      '--image', 'gcr.io/cafe-leather-eu/sync-database:develop-$SHORT_SHA',
      '--region', 'europe-west1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--ingress=all'
      ]

images:
  - gcr.io/cafe-leather-eu/sync-database:develop-$SHORT_SHA

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET